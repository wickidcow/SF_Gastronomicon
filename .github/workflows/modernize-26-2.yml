name: One-time Paper 26.2 modernization

on:
  push:
    branches: [master]
    paths:
      - .github/modernize-26-2.pending
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gastronomicon
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: gastronomicon

      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy

      - name: Apply modern compatibility patches
        run: |
          python3 gastronomicon/.github/scripts/modernize_26_2.py
          python3 - <<'PY'
          from pathlib import Path
          pom = Path('gastronomicon/pom.xml')
          text = pom.read_text(encoding='utf-8')
          text = text.replace(
              '<paper.version>[26.2.build,26.3.build)</paper.version>',
              '<paper.version>26.2.build.112-stable</paper.version>'
          )
          text = text.replace(
              '<artifactId>jackson-annotations</artifactId>\n            <version>2.22.0</version>',
              '<artifactId>jackson-annotations</artifactId>\n            <version>2.22</version>'
          )
          needle = '<release>${maven.compiler.release}</release>'
          processor = '''<release>${maven.compiler.release}</release>
                    <proc>full</proc>
                    <annotationProcessorPaths>
                        <path>
                            <groupId>org.projectlombok</groupId>
                            <artifactId>lombok</artifactId>
                            <version>1.18.46</version>
                        </path>
                    </annotationProcessorPaths>'''
          if needle not in text:
              raise SystemExit('Maven compiler release element not found')
          text = text.replace(needle, processor, 1)
          pom.write_text(text, encoding='utf-8')

          workflow = Path('gastronomicon/.github/workflows/build.yml')
          w = workflow.read_text(encoding='utf-8')
          w = w.replace('actions/checkout@v4', 'actions/checkout@v5')
          w = w.replace('actions/setup-java@v4', 'actions/setup-java@v5')
          w = w.replace('mvn -B -U clean package', 'mvn -B clean package')
          workflow.write_text(w, encoding='utf-8')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish Slimefun Legacy API to Maven local
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon

      - name: Build and validate Gastronomicon
        working-directory: gastronomicon
        run: |
          git diff --check
          mvn -B clean package
          test -f target/SF_Gastronomicon1.1.4.jar
          jar tf target/SF_Gastronomicon1.1.4.jar >/dev/null

      - name: Commit modernized source and workflow
        id: commit
        working-directory: gastronomicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modernize Gastronomicon for Paper 26.2 and Slimefun Legacy"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish direct unzipped JAR
        working-directory: gastronomicon
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          TAG="v1.1.4"
          JAR="target/SF_Gastronomicon1.1.4.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$TARGET_SHA" \
              --title "SF Gastronomicon 1.1.4" \
              --notes "Paper 26.2 / Slimefun Legacy compatibility build. The attached SF_Gastronomicon1.1.4.jar is a direct server JAR, not a ZIP archive."
          fi
