name: Build Gastronomicon 26.2 / Slimefun Legacy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-gastronomicon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gastronomicon
        uses: actions/checkout@v5
        with:
          path: gastronomicon

      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish current Slimefun Legacy API to Maven local
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon

      - name: Build Gastronomicon
        working-directory: gastronomicon
        run: mvn -B clean package

      - name: Resolve output name and verify direct JAR
        id: output
        working-directory: gastronomicon
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="target/SF_Gastronomicon${VERSION}.jar"
          test -f "$JAR"
          jar tf "$JAR" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=SF_Gastronomicon${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact without recompression
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.output.outputs.name }}
          path: gastronomicon/${{ steps.output.outputs.jar }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish direct unzipped JAR release asset
        working-directory: gastronomicon
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.output.outputs.version }}
          JAR: ${{ steps.output.outputs.jar }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
              --title "SF Gastronomicon ${VERSION}" \
              --notes "Paper 26.2 / Slimefun Legacy build. The attached SF_Gastronomicon${VERSION}.jar is the direct server JAR, not a ZIP archive."
          fi
