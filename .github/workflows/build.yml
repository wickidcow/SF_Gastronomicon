name: Build Gastronomicon Legacy

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-gastronomicon-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: "1.1.5"
  OUTPUT_NAME: "SF_Gastronomicon1.1.5.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gastronomicon
        uses: actions/checkout@v6
        with:
          path: gastronomicon
          persist-credentials: false
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy
          persist-credentials: false
      - name: Verify immutable publication policy and synthetic raw-JAR fixtures
        run: python3 -m unittest discover -s gastronomicon/scripts -p 'test_immutable_release_workflow.py' -v
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash gastronomicon/scripts/install_maven_3_10.sh
      - name: Publish current Slimefun Legacy API to Maven local
        working-directory: slimefun-legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon --refresh-dependencies; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Slimefun Legacy dependency build failed after 3 attempts." >&2
              exit 1
            fi
            echo "Transient dependency failure on attempt ${attempt}/3; retrying..."
            sleep $((attempt * 15))
          done
      - name: Verify Paper 1.21.11 baseline
        working-directory: gastronomicon
        run: mvn -B clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Verify Paper 26.2 primary compatibility
        working-directory: gastronomicon
        run: mvn -B clean package -Dpaper.version=26.2.build.112-stable
      - name: Verify Paper 26.3 stable compile compatibility
        working-directory: gastronomicon
        run: mvn -B clean package -Dpaper.version=26.3.build.230-stable
      - name: Rebuild universal release JAR from Paper 1.21.11
        working-directory: gastronomicon
        run: mvn -B clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Stage direct Gastronomicon JAR
        id: output
        working-directory: gastronomicon
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="target/${OUTPUT_NAME}"
          OUTPUT="dist/${OUTPUT_NAME}"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "$OUTPUT"
          unzip -tqq "$OUTPUT"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: ${RELEASE_VERSION}"
          python3 - <<'PY'
          import pathlib, struct, zipfile
          jar = pathlib.Path('dist/SF_Gastronomicon1.1.5.jar')
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if name.endswith('.class'):
                      data = zf.read(name)[:8]
                      if data[:4] == b'\xca\xfe\xba\xbe':
                          max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major == 0 or max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY
          sha256sum "$OUTPUT"
          python3 scripts/verify_immutable_release_jar.py "$OUTPUT" "$RELEASE_VERSION" "$(sha256sum "$OUTPUT" | cut -d' ' -f1)"
          echo "jar=$OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: gastronomicon/${{ steps.output.outputs.jar }}
          archive: false
          if-no-files-found: error
      - name: Publish only a NEW immutable release from exact green master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: gastronomicon
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.output.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          TAG="v${RELEASE_VERSION}"
          NAME="${OUTPUT_NAME}"
          SOURCE="dist/$NAME"
          test "$JAR" = "$SOURCE"
          EXPECTED_SHA256="$(sha256sum "$SOURCE" | cut -d' ' -f1)"
          python3 scripts/verify_immutable_release_jar.py "$SOURCE" "$RELEASE_VERSION" "$EXPECTED_SHA256"

          # Existing official releases are IMMUTABLE: do not even attempt upload.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                 >/dev/null 2>"$RUNNER_TEMP/release.err"; then
            echo "Official $TAG already exists: skipping without overwriting its asset."
            exit 0
          elif ! grep -Fq 'HTTP 404' "$RUNNER_TEMP/release.err"; then
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
          # An existing orphan tag must never be retargeted, reused or deleted.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                 >/dev/null 2>"$RUNNER_TEMP/tag.err"; then
            echo "Refusing existing $TAG without a release." >&2
            exit 1
          elif ! grep -Fq 'HTTP 404' "$RUNNER_TEMP/tag.err"; then
            cat "$RUNNER_TEMP/tag.err" >&2
            exit 1
          fi

          test -s "docs/releases/$RELEASE_VERSION.md"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > "$RUNNER_TEMP/tag.json"
          gh release create "$TAG" "$SOURCE" --verify-tag \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SF_Gastronomicon $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/published-jar"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$NAME" --dir "$RUNNER_TEMP/published-jar"
          python3 scripts/verify_immutable_release_jar.py \
            "$RUNNER_TEMP/published-jar/$NAME" "$RELEASE_VERSION" "$EXPECTED_SHA256"
